<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ironman Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
    <h1 class="text-xl font-bold text-amber-500">Ironman Tracker</h1>
    <div class="flex items-center space-x-3">
      <span id="user-email" class="text-xs text-slate-400 hidden sm:inline"></span>
      <button id="logout-btn" class="text-sm px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded">Logout</button>
    </div>
  </header>

  <nav class="bg-slate-800 border-b border-slate-700 flex justify-around text-sm font-medium">
    <button id="tab-today" class="py-3 px-4 text-amber-500 border-b-2 border-amber-500 tab-btn" data-tab="view-today">Today</button>
    <button id="tab-calendar" class="py-3 px-4 text-slate-400 hover:text-slate-200 tab-btn" data-tab="view-calendar">Calendar</button>
    <button id="tab-import" class="py-3 px-4 text-slate-400 hover:text-slate-200 tab-btn" data-tab="view-import">Import</button>
  </nav>

  <main id="app-content" class="flex-1 p-4 max-w-xl mx-auto w-full">
    <div id="view-today" class="tab-view"></div>
    <div id="view-calendar" class="tab-view hidden"><p class="text-slate-400 text-center py-8">Calendar View Coming Soon</p></div>
    <div id="view-import" class="tab-view hidden"><p class="text-slate-400 text-center py-8">Import View Coming Soon</p></div>
  </main>

  <script type="module">
    import { logout, checkAuthRedirect } from './js/auth.js';
    import { initTodayView } from './js/today.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const session = await checkAuthRedirect();
      if (session) {
        document.getElementById('user-email').textContent = session.user.email;
      }

      document.getElementById('logout-btn').addEventListener('click', logout);

      // Tab Switcher
      const tabBtns = document.querySelectorAll('.tab-btn');
      const tabViews = document.querySelectorAll('.tab-view');

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          tabBtns.forEach(b => {
            b.classList.remove('text-amber-500', 'border-b-2', 'border-amber-500');
            b.classList.add('text-slate-400');
          });
          tabViews.forEach(v => v.classList.add('hidden'));

          btn.classList.add('text-amber-500', 'border-b-2', 'border-amber-500');
          btn.classList.remove('text-slate-400');
          document.getElementById(btn.dataset.tab).classList.remove('hidden');
        });
      });

      // Initialize default view
      await initTodayView();
    });
  </script>
</body>
</html>
