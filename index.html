<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ironman Tracker - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
    <h1 class="text-2xl font-bold mb-6 text-center text-amber-500">Ironman Training Tracker</h1>
    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-500">
      </div>
      <div id="error-message" class="text-red-400 text-sm hidden"></div>
      <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 font-semibold py-2 rounded-lg text-slate-900 transition">Log In</button>
    </form>
  </div>

  <script type="module">
    import { login, checkAuthRedirect } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuthRedirect();

      const form = document.getElementById('login-form');
      const errEl = document.getElementById('error-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');
        
        try {
          await login(
            document.getElementById('email').value,
            document.getElementById('password').value
          );
          window.location.href = 'app.html';
        } catch (err) {
          errEl.textContent = err.message || 'Failed to authenticate.';
          errEl.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
